server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: good-maps-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cache:
    type: caffeine
    cache-names:
      - geocodingCache
      - activitiesCache

goodmaps:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}"
  osm:
    nominatim-url: "${OSM_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}"
    overpass-url: "${OSM_OVERPASS_BASE_URL:https://overpass-api.de/api/interpreter}"
    user-agent: "${OSM_USER_AGENT:GoodMapsAccessibilityPlatform/1.0 (contact: support@goodmaps.local)}"
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
  cache:
    geocoding-ttl-hours: ${CACHE_GEOCODING_TTL_HOURS:24}
    activities-ttl-minutes: ${CACHE_ACTIVITIES_TTL_MINUTES:60}
    max-size: ${CACHE_MAX_SIZE:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.goodmaps: DEBUG
