services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goodmaps-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://localhost:80,http://localhost"
      OSM_NOMINATIM_BASE_URL: "https://nominatim.openstreetmap.org"
      OSM_OVERPASS_BASE_URL: "https://overpass.openstreetmap.fr/api/interpreter"
      OSM_USER_AGENT: "GoodMapsAccessibilityPlatform/1.0 (contact: support@goodmaps.local)"
      CACHE_GEOCODING_TTL_HOURS: 24
      CACHE_ACTIVITIES_TTL_MINUTES: 60
      CACHE_MAX_SIZE: 1000
    networks:
      - goodmaps-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goodmaps-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - goodmaps-network

networks:
  goodmaps-network:
    driver: bridge
