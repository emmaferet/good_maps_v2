<main class="app-container">
  
  <!-- Écran 1 : Splash Screen & Chargement -->
  @if (showSplash()) {
    <app-splash (completed)="onSplashFinished()"></app-splash>
  }

  <!-- Écran 2 : Formulaire Bienvenue & Options d'accessibilité (Modale Onboarding) -->
  @if (showWelcomeModal()) {
    <app-welcome-modal 
      (completed)="onWelcomeCompleted($event)" 
      (closed)="showWelcomeModal.set(false)">
    </app-welcome-modal>
  }

  <!-- Modale Information (i) -->
  @if (showInfoModal()) {
    <app-info-modal (close)="closeInfoModal()"></app-info-modal>
  }

  <!-- Écran 3 : Vue Principale Complète (Header, Carte Leaflet, Suggestions, Fiche Activité) -->
  <div class="main-layout" [class.blurred]="showWelcomeModal() || showInfoModal()">
    
    <!-- 1. Header supérieur conforme à la maquette -->
    <app-header 
      (openFilters)="openFiltersModal()" 
      (openInfo)="openInfoModal()">
    </app-header>

    <!-- 2. Zone Cartographique Interactive -->
    <div class="map-view-container">
      <app-map 
        [centerLat]="centerLat" 
        [centerLon]="centerLon" 
        [activities]="activityService.currentActivities()" 
        [selectedActivity]="activityService.selectedActivity()"
        (activitySelected)="onActivitySelected($event)">
      </app-map>

      <!-- Indicateur de chargement réseau discret -->
      @if (activityService.isLoading()) {
        <div class="loading-overlay">
          <div class="loading-pill">
            <span class="spinner-dot"></span>
            <span>Interrogation d'OpenStreetMap...</span>
          </div>
        </div>
      }

      <!-- Message d'erreur éventuel -->
      @if (activityService.errorMessage()) {
        <div class="error-banner">
          <span>⚠️ {{ activityService.errorMessage() }}</span>
        </div>
      }

      <!-- 3. Bouton central rouge corail "Obtenir des suggestions" conforme au visuel 3 -->
      <div class="suggestions-button-container">
        <button class="btn-suggestions" 
                (click)="onGetSuggestions()" 
                [disabled]="activityService.isLoading()"
                aria-label="Obtenir les meilleures suggestions d'activités accessibles">
          @if (activityService.isLoading()) {
            <span class="btn-spinner"></span>
            <span>Recherche en cours...</span>
          } @else {
            Obtenir des suggestions
          }
        </button>
      </div>
    </div>

    <!-- 4. Fiche Descriptive Contextuelle (Bottom Sheet conforme au visuel 3) -->
    @if (activityService.selectedActivity(); as selected) {
      <div class="bottom-sheet-wrapper">
        <app-activity-card 
          [activity]="selected" 
          (close)="onCloseActivityCard()">
        </app-activity-card>
      </div>
    }

  </div>

</main>
