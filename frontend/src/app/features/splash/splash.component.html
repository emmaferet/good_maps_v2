<div class="splash-container" (click)="skip()" role="presentation">
  <div class="splash-content animate-slide-up">
    <!-- Logo Vectoriel Good Maps Conforme à la Maquette -->
    <div class="logo-wrapper">
      <svg class="brand-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Anneau extérieur noir / loupe stylisée -->
        <circle cx="50" cy="42" r="32" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
        <!-- Pointe inférieure de l'épingle / manche de loupe -->
        <path d="M68 62L82 78" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
        <!-- Épingle centrale rouge corail -->
        <path d="M50 24C43.3726 24 38 29.3726 38 36C38 44.5 50 56 50 56C50 56 62 44.5 62 36C62 29.3726 56.6274 24 50 24Z" 
              fill="#FF5A5F" />
        <circle cx="50" cy="35" r="4.5" fill="#FFFFFF"/>
      </svg>
    </div>

    <!-- Titre et sous-titre de la marque -->
    <div class="brand-typography">
      <h1 class="brand-title">
        <span class="text-good">GOOD</span>
        <span class="text-maps">MAPS</span>
      </h1>
      <p class="brand-subtitle">SUGGESTIONS D'ACTIVITÉS ADAPTÉES</p>
    </div>

    <!-- Indicateur de chargement fluide -->
    <div class="loader-track">
      <div class="loader-bar"></div>
    </div>
  </div>
</div>
